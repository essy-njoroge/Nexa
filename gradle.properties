android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# =========================
# Gradle Memory + Stability
# =========================
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# =========================
# Network Timeout Fix (Firebase / Maven issues)
# =========================
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000
org.gradle.internal.network.retryCount=10

# =========================
# Performance (optional but helpful)
# =========================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true